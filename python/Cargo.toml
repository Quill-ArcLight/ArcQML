[package]
name = "arcqml-python"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "arcqml"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { workspace = true, features = ["num-complex"] }
numpy.workspace = true
num-complex.workspace = true
arcqml-circuit.workspace = true
arcqml-analysis.workspace = true
arcqml-core.workspace = true
arcqml-loss.workspace = true
arcqml-observable.workspace = true
arcqml-optim.workspace = true
arcqml-sim.workspace = true
