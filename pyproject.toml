[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "arcqml"
dynamic = ["version"]
description = "Differentiable quantum circuits backed by the ArcQML Rust workspace"
readme = "README.md"
license = "LicenseRef-ArcQML-NC-Source-1.0 AND LicenseRef-ArcQML-NC-Runtime-1.0"
license-files = ["LICENSE", "LICENSE-RUNTIME", "THIRD_PARTY_NOTICES.md", "SECURITY.md", "RELEASE_NOTES.md", "examples/data/LICENSE-PDDL"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
dependencies = [
    "numpy>=1.24",
]

[tool.maturin]
manifest-path = "python/Cargo.toml"
module-name = "arcqml"
features = ["extension-module"]
